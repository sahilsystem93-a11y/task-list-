<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stylish To-Do List</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6d28d9, #9333ea, #ec4899);
      color: #fff;
    }
    .todo-app {
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
      width: 350px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .todo-app h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 26px;
      color: #f9fafb;
      text-shadow: 0 0 10px rgba(236,72,153,0.8);
    }
    .input-box {
      display: flex;
      margin-bottom: 20px;
    }
    #taskInput {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px 0 0 12px;
      font-size: 16px;
      outline: none;
    }
    #addBtn {
      background: #ec4899;
      border: none;
      padding: 12px 18px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 0 12px 12px 0;
      color: white;
      font-weight: bold;
      transition: 0.3s;
    }
    #addBtn:hover {
      background: #db2777;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: #334155;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      color: #f1f5f9;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      transition: 0.2s;
    }
    li:hover {
      transform: scale(1.03);
      background: #475569;
    }
    li.completed {
      text-decoration: line-through;
      color: #9ca3af;
    }
    .delete-btn {
      background: #ef4444;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }
    .delete-btn:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div class="todo-app">
    <h1>🌟 My To-Do List</h1>
    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Enter new task..." />
      <button id="addBtn">+</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', e => {
      if(e.key === 'Enter') addTask();
    });

    function addTask() {
      const task = taskInput.value.trim();
      if(task === '') return;
      const li = document.createElement('li');
      li.textContent = task;

      li.addEventListener('click', () => {
        li.classList.toggle('completed');
      });

      const del = document.createElement('button');
      del.textContent = "✖";
      del.className = "delete-btn";
      del.addEventListener('click', e => {
        e.stopPropagation();
        li.remove();
      });

      li.appendChild(del);
      taskList.appendChild(li);
      taskInput.value = '';
    }
  </script>
</body>
</html>
